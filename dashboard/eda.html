<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GA4 E-commerce KPI Dashboard</title>
    <link rel="stylesheet" href="./styles.css?v=20260821-3" />
  </head>
  <body class="eda-page">
    <main class="eda-shell">
      <header class="eda-header">
        <div>
          <p class="eyebrow">GA4 Merchandise Store · KPI Mart</p>
          <h1>E-commerce KPI Dashboard</h1>
          <p class="eda-subtitle">매출 상태와 원인을 Sessions × CVR × AOV 구조로 모니터링한다.</p>
        </div>
        <label class="eda-select">
          <span>Month</span>
          <select id="month-select"></select>
        </label>
      </header>

      <section id="eda-kpis" class="eda-kpis" aria-label="Selected period KPI"></section>

      <section class="eda-layout">
        <article class="eda-panel primary">
          <div class="panel-head">
            <div>
              <h2>KPI Trend</h2>
              <p id="trend-caption">실선은 일별 지표, 점선은 7일 이동평균</p>
            </div>
            <div class="trend-controls">
              <div class="grain-switch" id="grain-switch"></div>
              <div class="metric-switch" id="metric-switch"></div>
            </div>
          </div>
          <div id="main-trend" class="eda-chart"></div>
        </article>

        <article class="eda-panel">
          <div class="panel-head">
            <div>
              <h2 id="selected-title">Selected Day</h2>
              <p>차트의 점 클릭</p>
            </div>
          </div>
          <div id="day-detail" class="day-detail"></div>
        </article>

        <article class="eda-panel wide">
          <div class="panel-head">
            <div>
              <h2>Weekday Seasonality</h2>
              <p>요일별 평균 매출</p>
            </div>
          </div>
          <div id="weekday-bars" class="weekday-bars"></div>
        </article>

      </section>
    </main>
    <script src="./eda.js?v=20260821-3"></script>
  </body>
</html>
