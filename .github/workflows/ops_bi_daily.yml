name: ops-bi-daily

# Replay: each run loads the next data day (2020-11-01 ~ 2021-01-31), one data day per real day.
# Runs every day at 09:00 KST (cron is UTC: 00:00 UTC = 09:00 KST).
# GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Re-run a specific day (YYYY-MM-DD). Empty = next day."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ops-bi-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2  # provides the bq CLI

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Aggregate -> CSV -> Claude summary -> dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_DATE: ${{ inputs.date }}
        run: python -m pipeline.run_daily ${RUN_DATE:+--date "$RUN_DATE"}

      - name: Commit outputs (audit trail of every run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/runs site
          git diff --cached --quiet || git commit -m "ops-bi: daily run $(ls outputs/runs | tail -1)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
