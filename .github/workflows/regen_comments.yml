name: ops-bi-regen-comments

# Manual only: re-write the AI comment for days already loaded (numbers untouched), re-render
# them and publish. Shares the daily run's queue so the two never run at the same time.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD)"
        required: true
      end:
        description: "Last day (YYYY-MM-DD)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ops-bi-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install headless Chromium (dashboard -> PDF)
        run: python -m playwright install --with-deps chromium

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Re-write comments and re-render
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m pipeline.regen_comments "$START" "$END"

      - name: Commit outputs
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/runs site
          git diff --cached --quiet || git commit -m "ops-bi: AI comments $START..$END"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
